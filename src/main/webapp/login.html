<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 / 회원가입 - MyShop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-main" style="justify-content: center; position: relative;">
            <a href="index.html" class="logo">
                <span>🛍️</span> MyShop
            </a>
            <a href="index.html" style="position: absolute; right: 24px; font-size: 0.9rem; color: #64748b; font-weight: 600;">← 홈으로 돌아가기</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-wrapper" style="display: flex; align-items: center; justify-content: center;">
        <div class="container">
            <div class="auth-card">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tab-login-btn" onclick="switchTab('login')">로그인</button>
                    <button class="auth-tab" id="tab-signup-btn" onclick="switchTab('signup')">회원가입</button>
                </div>

                <!-- Login Form -->
                <form id="form-login" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">이메일 주소</label>
                        <input type="email" id="login-email" placeholder="example@myshop.com" required>
                    </div>

                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <label for="login-password" style="margin-bottom: 0;">비밀번호</label>
                            <a href="#" style="font-size: 0.8rem; color: #2563eb;">비밀번호 찾기</a>
                        </div>
                        <input type="password" id="login-password" placeholder="비밀번호를 입력하세요" required>
                    </div>

                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px; font-size: 0.88rem; color: #64748b;">
                        <input type="checkbox" id="remember-me" checked>
                        <label for="remember-me" style="margin-bottom: 0; cursor: pointer;">로그인 상태 유지</label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
                        로그인
                    </button>
                </form>

                <!-- Signup Form -->
                <form id="form-signup" style="display: none;" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label for="signup-name">이름</label>
                        <input type="text" id="signup-name" placeholder="홍길동" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-email">이메일 주소</label>
                        <input type="email" id="signup-email" placeholder="example@myshop.com" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">비밀번호 (8자 이상, 영문/숫자 포함)</label>
                        <input type="password" id="signup-password" placeholder="비밀번호 설정" required>
                    </div>

                    <div style="display: flex; align-items: flex-start; gap: 8px; margin-bottom: 24px; font-size: 0.85rem; color: #64748b;">
                        <input type="checkbox" id="terms-agree" required style="margin-top: 3px;">
                        <label for="terms-agree" style="margin-bottom: 0; cursor: pointer;">
                            <a href="#" style="color: #2563eb; text-decoration: underline;">이용약관</a> 및 <a href="#" style="color: #2563eb; text-decoration: underline;">개인정보 처리방침</a>에 동의합니다.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
                        가입 완료하고 혜택 받기
                    </button>
                </form>

                <!-- Social Login Section -->
                <div class="social-login">
                    <p style="text-align: center; font-size: 0.82rem; color: #94a3b8; margin-bottom: 12px;">간편 소셜 계정으로 로그인</p>
                    <button class="btn-social" onclick="alert('카카오 로그인 API 연동 준비 중입니다.')">
                        <span>💬</span> 카카오로 시작하기
                    </button>
                    <button class="btn-social" onclick="alert('Google 로그인 API 연동 준비 중입니다.')">
                        <span>🌐</span> Google 계정으로 시작하기
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" style="padding: 24px 0;">
        <div class="container" style="text-align: center; font-size: 0.82rem;">
            &copy; 2026 MyShop Co., Ltd. All rights reserved.
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        function switchTab(tab) {
            const loginBtn = document.getElementById("tab-login-btn");
            const signupBtn = document.getElementById("tab-signup-btn");
            const loginForm = document.getElementById("form-login");
            const signupForm = document.getElementById("form-signup");

            if (tab === "signup") {
                loginBtn.classList.remove("active");
                signupBtn.classList.add("active");
                loginForm.style.display = "none";
                signupForm.style.display = "block";
            } else {
                signupBtn.classList.remove("active");
                loginBtn.classList.add("active");
                signupForm.style.display = "none";
                loginForm.style.display = "block";
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            alert(`${email} 님, 환영합니다! 로그인되었습니다.`);
            window.location.href = "index.html";
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById("signup-name").value;
            alert(`축하합니다 ${name}님! 회원가입이 완료되었습니다. 10,000원 쿠폰이 지급되었습니다.`);
            window.location.href = "index.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get("tab") === "signup") {
                switchTab("signup");
            }
        });
    </script>
</body>
</html>

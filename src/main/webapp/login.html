<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 / 회원가입 - Share Treats</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Build Version Bar -->
    <div class="build-version-bar">
        <div class="container">
            <span>Share Treats Web UI · <strong class="build-version-badge js-build-version">Build v0.01</strong></span>
            <span>Design Theme: sharetreats.ph/welcome</span>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container header-main" style="justify-content: center; position: relative;">
            <a href="index.html" class="logo">
                <span class="logo-icon-box">🎁</span>
                <div>
                    ShareTreats
                    <span class="logo-sub">MEMBER</span>
                </div>
            </a>
            <a href="index.html" style="position: absolute; right: 24px; font-size: 0.9rem; color: #786b65; font-weight: 700;">← Welcome 홈으로</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-wrapper" style="display: flex; align-items: center; justify-content: center;">
        <div class="container">
            <div class="auth-card">
                <div style="text-align: center; margin-bottom: 20px;">
                    <span class="section-eyebrow">WELCOME TO SHARE TREATS</span>
                    <h2 style="font-size: 1.45rem; font-weight: 900; margin-top: 4px;">일상 속 달콤한 기프팅의 시작</h2>
                </div>

                <div class="auth-tabs">
                    <button class="auth-tab active" id="tab-login-btn" onclick="switchTab('login')">로그인</button>
                    <button class="auth-tab" id="tab-signup-btn" onclick="switchTab('signup')">회원가입</button>
                </div>

                <!-- Login Form -->
                <form id="form-login" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">휴대폰 번호 또는 이메일</label>
                        <input type="text" id="login-email" placeholder="010-1234-5678 또는 user@sharetreats.ph" required>
                    </div>

                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <label for="login-password" style="margin-bottom: 0;">비밀번호</label>
                            <a href="#" style="font-size: 0.8rem; color: #ff5722; font-weight: 700;">비밀번호 찾기</a>
                        </div>
                        <input type="password" id="login-password" placeholder="비밀번호를 입력하세요" required>
                    </div>

                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px; font-size: 0.88rem; color: #786b65;">
                        <input type="checkbox" id="remember-me" checked>
                        <label for="remember-me" style="margin-bottom: 0; cursor: pointer;">로그인 상태 유지</label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
                        🎁 Share Treats 로그인
                    </button>
                </form>

                <!-- Signup Form -->
                <form id="form-signup" style="display: none;" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label for="signup-name">이름 (보내는 분 표시명)</label>
                        <input type="text" id="signup-name" placeholder="홍길동" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-email">휴대폰 번호 또는 이메일</label>
                        <input type="text" id="signup-email" placeholder="010-1234-5678 또는 user@sharetreats.ph" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">비밀번호 (8자 이상)</label>
                        <input type="password" id="signup-password" placeholder="비밀번호 설정" required>
                    </div>

                    <div style="display: flex; align-items: flex-start; gap: 8px; margin-bottom: 24px; font-size: 0.85rem; color: #786b65;">
                        <input type="checkbox" id="terms-agree" required style="margin-top: 3px;">
                        <label for="terms-agree" style="margin-bottom: 0; cursor: pointer;">
                            <a href="#" style="color: #ff5722; text-decoration: underline;">서비스 이용약관</a> 및 <a href="#" style="color: #ff5722; text-decoration: underline;">개인정보 처리방침</a>에 동의합니다.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
                        🎉 가입 완료하고 웰컴 트릿 받기
                    </button>
                </form>

                <!-- Social & e-Wallet Login Section -->
                <div class="social-login">
                    <p style="text-align: center; font-size: 0.82rem; color: #786b65; margin-bottom: 10px; font-weight: 600;">간편 소셜 및 e-Wallet 연동 로그인</p>
                    <button class="btn-social" onclick="alert('GCash / GLife 간편 연동 준비 중입니다.')">
                        <span>💙</span> GCash / GLife로 계속하기
                    </button>
                    <button class="btn-social" onclick="alert('카카오 간편 로그인 연동 준비 중입니다.')">
                        <span>💬</span> 카카오 계정으로 시작하기
                    </button>
                    <button class="btn-social" onclick="alert('Google 계정 로그인 연동 준비 중입니다.')">
                        <span>🌐</span> Google 계정으로 시작하기
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" style="padding: 24px 0;">
        <div class="container" style="text-align: center; font-size: 0.82rem;">
            &copy; 2026 Share Treats Innovation Corp. &amp; MyShop. All rights reserved.
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        function switchTab(tab) {
            const loginBtn = document.getElementById("tab-login-btn");
            const signupBtn = document.getElementById("tab-signup-btn");
            const loginForm = document.getElementById("form-login");
            const signupForm = document.getElementById("form-signup");

            if (tab === "signup") {
                loginBtn.classList.remove("active");
                signupBtn.classList.add("active");
                loginForm.style.display = "none";
                signupForm.style.display = "block";
            } else {
                signupBtn.classList.remove("active");
                loginBtn.classList.add("active");
                signupForm.style.display = "none";
                loginForm.style.display = "block";
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            alert(`${email} 님, Share Treats에 오신 것을 환영합니다!`);
            window.location.href = "index.html";
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById("signup-name").value;
            alert(`축하합니다 ${name}님! Share Treats 가입이 완료되었습니다.`);
            window.location.href = "index.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get("tab") === "signup") {
                switchTab("signup");
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전체 상품 목록 - MyShop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container">
            <span>🎉 첫 회원가입 시 10,000원 웰컴 쿠폰팩 즉시 지급!</span>
            <div class="top-bar-links">
                <a href="login.html">로그인</a>
                <a href="login.html?tab=signup">회원가입</a>
                <a href="#">고객센터</a>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container header-main">
            <a href="index.html" class="logo">
                <span>🛍️</span> MyShop
            </a>

            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" id="product-search-input" placeholder="상품명 또는 카테고리를 검색하세요..." onkeyup="filterProducts()">
            </div>

            <div class="nav-actions">
                <a href="login.html" class="nav-btn">
                    <span style="font-size: 1.3rem;">👤</span>
                    <span>마이페이지</span>
                </a>
                <a href="cart.html" class="nav-btn">
                    <span style="font-size: 1.3rem;">🛒</span>
                    <span>장바구니</span>
                    <span class="badge-count">0</span>
                </a>
            </div>
        </div>

        <nav class="gnb-menu">
            <div class="container">
                <ul>
                    <li><a href="index.html">홈</a></li>
                    <li><a href="products.html" class="active">전체상품</a></li>
                    <li><a href="products.html?filter=best">베스트 랭킹</a></li>
                    <li><a href="products.html?filter=new">신상품</a></li>
                    <li><a href="products.html?filter=sale">타임특가</a></li>
                    <li><a href="cart.html">장바구니</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-wrapper">
        <div class="container">
            <!-- Breadcrumbs -->
            <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 24px;">
                <a href="index.html">홈</a> &gt; <span style="color: #1e293b; font-weight: 600;">전체 상품 목록</span>
            </div>

            <div class="layout-split">
                <!-- Sidebar Filter -->
                <aside class="filter-sidebar">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h4 style="font-size: 1.1rem; font-weight: 800;">필터 검색</h4>
                        <button style="background: none; border: none; color: #2563eb; font-size: 0.8rem; font-weight: 600; cursor: pointer;" onclick="resetFilters()">초기화</button>
                    </div>

                    <div class="filter-group">
                        <div class="filter-title">카테고리</div>
                        <ul class="filter-list">
                            <li><label><input type="radio" name="cat" value="all" checked onchange="filterProducts()"> 전체 보기</label></li>
                            <li><label><input type="radio" name="cat" value="fashion" onchange="filterProducts()"> 패션의류 (Fashion)</label></li>
                            <li><label><input type="radio" name="cat" value="electronics" onchange="filterProducts()"> 디지털/가전 (Tech)</label></li>
                            <li><label><input type="radio" name="cat" value="beauty" onchange="filterProducts()"> 뷰티/케어 (Beauty)</label></li>
                            <li><label><input type="radio" name="cat" value="living" onchange="filterProducts()"> 가구/인테리어 (Living)</label></li>
                        </ul>
                    </div>

                    <div class="filter-group">
                        <div class="filter-title">가격대</div>
                        <ul class="filter-list">
                            <li><label><input type="radio" name="price" value="all" checked onchange="filterProducts()"> 전체 가격</label></li>
                            <li><label><input type="radio" name="price" value="under5" onchange="filterProducts()"> 5만원 미만</label></li>
                            <li><label><input type="radio" name="price" value="5to10" onchange="filterProducts()"> 5만원 ~ 10만원</label></li>
                            <li><label><input type="radio" name="price" value="over10" onchange="filterProducts()"> 10만원 이상</label></li>
                        </ul>
                    </div>

                    <div class="filter-group">
                        <div class="filter-title">배송 혜택</div>
                        <ul class="filter-list">
                            <li><label><input type="checkbox"> 무료배송</label></li>
                            <li><label><input type="checkbox"> 당일출발 (빠른배송)</label></li>
                        </ul>
                    </div>
                </aside>

                <!-- Products Grid Area -->
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <span style="font-size: 0.95rem; color: #475569;">총 <b id="product-count" style="color: #2563eb;">8</b>개의 상품</span>
                        <select style="padding: 8px 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;" onchange="sortProducts(this.value)">
                            <option value="recommend">추천순</option>
                            <option value="lowPrice">낮은 가격순</option>
                            <option value="highPrice">높은 가격순</option>
                            <option value="rating">평점 높은순</option>
                        </select>
                    </div>

                    <div class="product-grid" id="products-catalog-grid" style="grid-template-columns: repeat(3, 1fr);">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border: none; padding-top: 0;">
                <span>&copy; 2026 MyShop Co., Ltd. All rights reserved.</span>
                <span>WAS / WAR 배포 아키텍처 호환</span>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        let currentProducts = [...PRODUCTS_DATA];

        function renderCatalog(items) {
            renderProductCards(items, "products-catalog-grid");
            document.getElementById("product-count").innerText = items.length;
        }

        function filterProducts() {
            const query = document.getElementById("product-search-input").value.toLowerCase();
            const selectedCat = document.querySelector('input[name="cat"]:checked').value;
            const selectedPrice = document.querySelector('input[name="price"]:checked').value;

            let filtered = PRODUCTS_DATA.filter(p => {
                const matchQuery = p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query);
                const matchCat = selectedCat === "all" || p.category === selectedCat;
                let matchPrice = true;
                if (selectedPrice === "under5") matchPrice = p.price < 50000;
                else if (selectedPrice === "5to10") matchPrice = p.price >= 50000 && p.price <= 100000;
                else if (selectedPrice === "over10") matchPrice = p.price > 100000;

                return matchQuery && matchCat && matchPrice;
            });

            currentProducts = filtered;
            renderCatalog(currentProducts);
        }

        function sortProducts(criteria) {
            if (criteria === "lowPrice") currentProducts.sort((a, b) => a.price - b.price);
            else if (criteria === "highPrice") currentProducts.sort((a, b) => b.price - a.price);
            else if (criteria === "rating") currentProducts.sort((a, b) => b.rating - a.rating);
            else currentProducts.sort((a, b) => a.id - b.id);
            renderCatalog(currentProducts);
        }

        function resetFilters() {
            document.querySelector('input[name="cat"][value="all"]').checked = true;
            document.querySelector('input[name="price"][value="all"]').checked = true;
            document.getElementById("product-search-input").value = "";
            currentProducts = [...PRODUCTS_DATA];
            renderCatalog(currentProducts);
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Check url params for category
            const urlParams = new URLSearchParams(window.location.search);
            const cat = urlParams.get("cat");
            if (cat) {
                const radio = document.querySelector(`input[name="cat"][value="${cat}"]`);
                if (radio) radio.checked = true;
            }
            filterProducts();
        });
    </script>
</body>
</html>

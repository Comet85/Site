<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 완료 - MyShop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-main">
            <a href="index.html" class="logo">
                <span>🛍️</span> MyShop
            </a>
            <div class="nav-actions">
                <a href="index.html" class="nav-btn">홈으로</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-wrapper">
        <div class="container" style="max-width: 680px;">
            <div style="background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 48px 36px; text-align: center; box-shadow: var(--shadow-sm); margin-top: 20px;">
                <div style="font-size: 4.5rem; margin-bottom: 20px;">🎉</div>
                <span style="background: #ecfdf5; color: #059669; font-weight: 700; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;">결제 및 주문 완료</span>
                <h2 style="font-size: 1.8rem; font-weight: 800; margin: 16px 0 8px;">주문이 정상적으로 접수되었습니다!</h2>
                <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 32px;">고객님의 소중한 상품을 꼼꼼하게 검수하여 안전하게 배송해 드리겠습니다.</p>

                <!-- Order Details Box -->
                <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; text-align: left; margin-bottom: 32px; font-size: 0.9rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0;">
                        <span style="color: #64748b;">주문 번호</span>
                        <span style="font-weight: 700; color: #2563eb;" id="order-number">ORD-20261109-8472</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                        <span style="color: #64748b;">결제 수단</span>
                        <span style="font-weight: 600;">신용/체크카드 (일시불)</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                        <span style="color: #64748b;">배송지 정보</span>
                        <span style="font-weight: 600;">서울시 강남구 테헤란로 123</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: #64748b;">배송 예정일</span>
                        <span style="font-weight: 700; color: #10b981;">내일 오후 도착 보장</span>
                    </div>
                </div>

                <div style="display: flex; gap: 12px;">
                    <a href="index.html" class="btn btn-outline" style="flex: 1; padding: 14px;">홈으로 가기</a>
                    <a href="products.html" class="btn btn-primary" style="flex: 1; padding: 14px;">계속 쇼핑하기 →</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" style="padding: 24px 0; margin-top: 60px;">
        <div class="container" style="text-align: center; font-size: 0.82rem;">
            &copy; 2026 MyShop Co., Ltd. All rights reserved.
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Clear cart upon successful order
            localStorage.removeItem("shop_cart");
            updateCartBadge();
            // Random order number
            const rand = Math.floor(1000 + Math.random() * 9000);
            document.getElementById("order-number").innerText = `ORD-20261109-${rand}`;
        });
    </script>
</body>
</html>
